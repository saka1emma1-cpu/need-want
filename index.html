<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Na Need or Na Want? Money Advisor</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
html,body { width:100%; min-height:100vh; background:#f5f5f7; }
.app { width:100%; min-height:100vh; background:white; display:flex; flex-direction:column; }
.header { padding:20px 16px; font-weight:900; font-size:20px; border-bottom:1px solid #eee; background:white; position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center; }
.score-box { background:#111; color:white; border-radius:16px; padding:18px; margin:12px 16px; display:flex; justify-content:space-between; align-items:center; }
.form { padding:16px; display:flex; flex-direction:column; gap:12px; }
.form input, .form select, .form textarea { width:100%; padding:18px 14px; border-radius:12px; border:2px solid #e5e5e5; font-size:16px; background:white; outline:none; }
.form input:focus { border-color:#111; }
.row { display:flex; gap:10px; }
.row input { flex:1; }
.btn { background:#111; color:white; padding:18px; border:none; border-radius:12px; font-size:17px; font-weight:900; width:100%; cursor:pointer; }
.btn-green { background:#00c853; }
.btn-red { background:#ff1744; }
.btn-outline { background:white; border:2px solid #111; color:#111; }
.list-item { background:#fafafa; padding:12px; border-radius:10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border-left:5px solid #ddd; }
.list-item.need { border-left-color:#00c853; } .list-item.want { border-left-color:#ff1744; }
#advice { margin:12px 16px; padding:18px; border-radius:14px; background:#fffde7; border:2px solid #111; display:none; line-height:1.6; font-size:16px; white-space:pre-line; }
.history { padding:16px; background:#f9f9f9; flex:1; }
.badge { font-size:11px; padding:3px 8px; border-radius:20px; font-weight:800; }
.badge-need { background:#e8f5e9; color:#00c853; } .badge-want { background:#ffebee; color:#ff1744; }
</style>
</head>
<body>
<div class="app">
<div class="header"><span>🧠 Money Advisor v5</span><span id="score" style="font-size:14px; background:#111; color:white; padding:6px 10px; border-radius:20px;">Score: 0</span></div>

<div class="score-box">
<div><small>Today Income</small><h2 style="font-size:28px;">₦<span id="incomeDisplay">0</span></h2></div>
<div style="text-align:right;"><small>Balance Left</small><h2 id="balanceDisplay" style="font-size:24px;">₦0</h2></div>
</div>

<div class="form">
<div class="row">
<input id="dailyIncome" type="number" placeholder="Today you made ₦? e.g 5000">
<button class="btn" style="width:110px;" onclick="setIncome()">Set</button>
</div>

<h4 style="margin-top:8px;">How you want to spend today?</h4>
<input id="item" placeholder="Item: e.g Rice, Data, Shawarma">
<div class="row">
<input id="price" type="number" placeholder="Price ₦">
<input id="why" placeholder="Why? family eat">
</div>
<div class="row">
<select id="choice" style="flex:1; padding:18px 14px; border-radius:12px; border:2px solid #e5e5e5;">
<option value="">You think NEED or WANT?</option><option>NEED</option><option>WANT</option>
</select>
<button class="btn btn-green" style="width:110px;" onclick="addItem()">+ Add</button>
</div>

<div id="spendList"></div>

<button class="btn" onclick="advise()" style="margin-top:6px;">💡 Get My Money Advice</button>
<button class="btn btn-outline" onclick="clearDay()">🗑️ Clear Today</button>
</div>

<div id="advice"></div>
<div class="history"><h4>Today's Plan</h4><small id="summaryText"></small></div>
</div>

<script>
let income = parseInt(localStorage.getItem('nw_income')||'0');
let items = JSON.parse(localStorage.getItem('nw_items')||'[]');
let score = parseInt(localStorage.getItem('nw_score')||'0');
const NEED_WORDS = ['rice','garri','beans','food','eat','family','medicine','drug','hospital','school','fees','book','rent','house','transport','fuel','light','nepa','water','work','job','business','learn','child','baby','uniform','provision','oil','salt'];
const WANT_WORDS = ['shawarma','pizza','burger','iphone','ps5','bet','alcohol','beer','club','party','wig','makeup','jewelry','gold','shoe new','cloth new','netflix','shisha','game'];

function smartDecide(text){
  text=text.toLowerCase(); let n=0,w=0;
  NEED_WORDS.forEach(x=>{if(text.includes(x)) n+=2});
  WANT_WORDS.forEach(x=>{if(text.includes(x)) w+=2});
  if(text.match(/family.*eat|my family|children.*eat|school|for work|business|to work|go to work/)) n+=5;
  if(text.match(/show off|shakara|flex|party|enjoy|impress/)) w+=4;
  if(n>w) return 'NEED'; if(w>n) return 'WANT'; return 'UNKNOWN';
}

function setIncome(){
  let v=parseInt(document.getElementById('dailyIncome').value);
  if(!v) return alert('Enter today income');
  income=v; localStorage.setItem('nw_income',income);
  render();
}

function addItem(){
  let item=document.getElementById('item').value.trim();
  let price=parseInt(document.getElementById('price').value)||0;
  let why=document.getElementById('why').value.trim();
  let userChoice=document.getElementById('choice').value;
  if(!item||!price) return alert('Enter item and price');
  let brain=smartDecide(item+' '+why);
  if(brain==='UNKNOWN') brain=userChoice||'NEED';
  items.push({item,price,why:why||'',userChoice,brain,id:Date.now()});
  localStorage.setItem('nw_items',JSON.stringify(items));
  document.getElementById('item').value=''; document.getElementById('price').value=''; document.getElementById('why').value='';
  render();
}

function deleteItem(id){
  items=items.filter(x=>x.id!==id);
  localStorage.setItem('nw_items',JSON.stringify(items));
  render();
}

function advise(){
  if(items.length===0) return alert('Add what you want to buy first');
  let needs=items.filter(i=>i.brain==='NEED');
  let wants=items.filter(i=>i.brain==='WANT');
  let needTotal=needs.reduce((s,i)=>s+i.price,0);
  let wantTotal=wants.reduce((s,i)=>s+i.price,0);
  let total=needTotal+wantTotal;
  let balance=income-total;
  let adviceEl=document.getElementById('advice'); adviceEl.style.display='block';

  let msg='';
  if(income===0){
    msg=`⚠️ You never set today income!\nSet how much you made today first.`;
  } else if(total>income){
    let over=total-income;
    msg=`🚨 OVERSPENDING! You want to spend ₦${total} but you made ₦${income} today.\nYou are OVER by ₦${over}.\n\n`;
    msg+=`✅ MUST DO (NEEDS): ₦${needTotal}\n${needs.map(n=>` • ${n.item} - ₦${n.price} (${n.why||'survival'})`).join('\n')}\n\n`;
    if(wants.length>0){
      msg+=`❌ CUT THESE WANTS (Save ₦${wantTotal}):\n${wants.map(w=>` • ${w.item} - ₦${w.price} = ${Math.floor(w.price/200)} days lost`).join('\n')}\n\n`;
      msg+=`💡 ADVICE: Pay NEEDS first (₦${needTotal}). Keep ₦${income-needTotal} leftover. Remove all WANTS today. Your discipline score -3 if you still buy wants.`;
      score=Math.max(0,score-1);
    } else {
      msg+=`💡 Even your NEEDS are too much. Remove cheapest need or borrow wisely.`;
    }
  } else {
    let save=income-total;
    msg=`✅ GOOD PLAN! Income ₦${income}, Spend ₦${total}, Save ₦${save}\n\n`;
    msg+=`NEEDS (₦${needTotal}) — Pay first:\n${needs.map(n=>` • ${n.item} - ₦${n.price}`).join('\n')||' (none)'}\n\n`;
    if(wants.length>0){
      msg+=`WANTS (₦${wantTotal}) — Only if you still have:\n${wants.map(w=>` • ${w.item} - ₦${w.price}`).join('\n')}\n\n`;
      if(save<income*0.2){
        msg+=`💡 Advice: You are spending almost all. Save at least 20% (₦${Math.floor(income*0.2)}). Consider removing 1 WANT. Score +2 if you save.`;
      } else {
        msg+=`💡 You can afford 1 small WANT and still save ₦${save}. Great discipline! Score +5`;
        score+=5;
      }
    } else {
      msg+=`🔥 Perfect! No wants. You save ₦${save}. Master level! Score +10`;
      score+=10;
    }
  }
  adviceEl.innerText=msg;
  localStorage.setItem('nw_score',score);
  render();
}

function render(){
  document.getElementById('incomeDisplay').innerText=income;
  let total=items.reduce((s,i)=>s+i.price,0);
  let bal=income-total;
  let balEl=document.getElementById('balanceDisplay');
  balEl.innerText='₦'+bal;
  balEl.style.color=bal<0?'#ff1744':'#00c853';
  document.getElementById('score').innerText='Score: '+score;
  document.getElementById('spendList').innerHTML=items.map(i=>`
    <div class="list-item ${i.brain==='NEED'?'need':'want'}">
      <div><b>${i.item} - ₦${i.price}</b> <span class="badge ${i.brain==='NEED'?'badge-need':'badge-want'}">${i.brain}</span><br><small>${i.why||''} (You: ${i.userChoice||i.brain})</small></div>
      <button onclick="deleteItem(${i.id})" style="background:none; border:none; font-size:20px;">✕</button>
    </div>
  `).join('');
  document.getElementById('summaryText').innerText= items.length? `Total planned: ₦${total} | Needs: ₦${items.filter(i=>i.brain==='NEED').reduce((s,i)=>s+i.price,0)} | Wants: ₦${items.filter(i=>i.brain==='WANT').reduce((s,i)=>s+i.price,0)}` : 'Add items you want to spend on today';
}

function clearDay(){
  if(confirm('Clear today list?')){
    items=[]; localStorage.removeItem('nw_items'); document.getElementById('advice').style.display='none'; render();
  }
}

render();
if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())); caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))); }
</script>
</body>
</html>
