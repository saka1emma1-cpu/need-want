<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Money Advisor v7 - Calendar</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
html,body { width:100%; min-height:100vh; background:#f5f5f7; }
.app { width:100%; min-height:100vh; background:white; display:flex; flex-direction:column; }
.header { padding:14px 16px; font-weight:900; font-size:18px; border-bottom:1px solid #eee; background:white; position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center; }
.score-box { background:#111; color:white; border-radius:16px; padding:14px; margin:8px 16px; display:flex; justify-content:space-between; align-items:center; }
.form { padding:10px 16px; display:flex; flex-direction:column; gap:8px; }
.form input,.form select { width:100%; padding:14px 12px; border-radius:10px; border:2px solid #e5e5e5; font-size:14px; background:white; outline:none; }
.row { display:flex; gap:6px; }
.row input { flex:1; }
.btn { background:#111; color:white; padding:14px; border:none; border-radius:10px; font-size:14px; font-weight:900; width:100%; cursor:pointer; }
.btn-green { background:#00c853; }.btn-blue { background:#2962ff; }.btn-outline { background:white; border:2px solid #111; color:#111; }
.list-item { background:#fafafa; padding:8px 10px; border-radius:8px; margin-bottom:5px; display:flex; justify-content:space-between; align-items:center; border-left:4px solid #ddd; font-size:13px; }
.list-item.need { border-left-color:#00c853; }.list-item.want { border-left-color:#ff1744; }
#advice { margin:8px 16px; padding:14px; border-radius:12px; background:#fffde7; border:2px solid #111; display:none; line-height:1.5; font-size:14px; white-space:pre-line; }
/* CALENDAR STYLES */
.calendar-wrap { margin:10px 16px; background:#fff; border:2px solid #111; border-radius:14px; padding:12px; }
.cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-weight:900; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
.cal-day-name { font-size:11px; font-weight:800; color:#999; padding:4px; }
.cal-day { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:10px; font-size:12px; font-weight:700; cursor:pointer; border:1px solid #f0f0f0; position:relative; }
.cal-day.today { border:2px solid #111; }
.cal-day.saved { background:#00c853; color:white; border-color:#00c853; }
.cal-day.no-save { background:#ff1744; color:white; border-color:#ff1744; }
.cal-day.empty { background:#f5f5f5; color:#ccc; }
.cal-day.amt { font-size:8px; font-weight:800; }
.history-section { padding:12px 16px; background:#f9f9f9; }
.day-card { background:white; padding:10px; border-radius:8px; margin-bottom:6px; border:1px solid #eee; font-size:13px; }
.badge { font-size:9px; padding:2px 6px; border-radius:20px; font-weight:800; }
.badge-need { background:#e8f5e9; color:#00c853; }.badge-want { background:#ffebee; color:#ff1744; }
.toggle { display:flex; gap:5px; background:#eee; padding:3px; border-radius:20px; width:fit-content; }
.toggle button { padding:5px 10px; border-radius:20px; border:none; font-weight:800; font-size:11px; }
.toggle.active { background:#111; color:white; }
</style>
</head>
<body>
<div class="app">
<div class="header"><span>🧠 Money Advisor v7 📅</span><span id="score" style="font-size:11px; background:#111; color:white; padding:4px 8px; border-radius:20px;">Score: 0</span></div>

<div class="score-box">
<div><small style="font-size:11px;">Today Income</small><h2 style="font-size:22px;">₦<span id="incomeDisplay">0</span></h2></div>
<div style="text-align:right;"><small style="font-size:11px;">Balance Left</small><h2 id="balanceDisplay" style="font-size:20px;">₦0</h2></div>
</div>

<div class="form">
<div class="row">
<input id="dailyIncome" type="number" placeholder="Today made ₦? e.g 10000">
<button class="btn" style="width:80px;" onclick="setIncome()">Set</button>
</div>
<input id="item" placeholder="Item: Fuel, Rice, Clothes">
<div class="row">
<input id="price" type="number" placeholder="Price ₦">
<input id="why" placeholder="Why?">
</div>
<div class="row">
<select id="choice" style="flex:1; padding:14px 12px; border-radius:10px; border:2px solid #e5e5e5; font-size:14px;">
<option value="">NEED or WANT?</option><option>NEED</option><option>WANT</option>
</select>
<button class="btn btn-green" style="width:80px;" onclick="addItem()">+ Add</button>
</div>
<div id="spendList"></div>
<div class="toggle">
<button id="btnEng" class="active" onclick="setLang('en')">English</button>
<button id="btnPid" onclick="setLang('pidgin')">Pidgin 🔥</button>
</div>
<button class="btn" onclick="advise()">💡 Get My Money Advice</button>
<div class="row">
<button class="btn btn-blue" style="flex:1;" onclick="sharePlan()">📤 Share WhatsApp</button>
<button class="btn btn-outline" style="flex:1;" onclick="clearDay()">🗑️ Clear</button>
</div>
</div>

<div id="advice"></div>

<!-- REAL TIME CALENDAR -->
<div class="calendar-wrap">
<div class="cal-header">
<button onclick="changeMonth(-1)" style="border:none; background:#eee; padding:6px 12px; border-radius:8px;">◀</button>
<span id="calMonth">October 2026</span>
<button onclick="changeMonth(1)" style="border:none; background:#eee; padding:6px 12px; border-radius:8px;">▶</button>
</div>
<div class="cal-grid" id="calGrid"></div>
<div style="display:flex; gap:8px; margin-top:8px; font-size:11px;">
<span style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; background:#00c853; border-radius:3px; display:inline-block;"></span> Saved</span>
<span style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; background:#ff1744; border-radius:3px; display:inline-block;"></span> No Save</span>
<span style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; background:#f5f5f5; border:1px solid #ddd; border-radius:3px; display:inline-block;"></span> No Record</span>
</div>
<div id="calDetails" style="margin-top:10px; font-size:12px; background:#f9f9f9; padding:8px; border-radius:8px; display:none;"></div>
</div>

<div class="history-section">
<h4 style="font-size:14px;">📊 Recent Saves</h4>
<div id="historyList" style="margin-top:8px;"></div>
<div style="margin-top:8px;"><small id="summaryText" style="font-size:11px;"></small></div>
</div>
</div>

<script>
let income = parseInt(localStorage.getItem('nw_income')||'0');
let items = JSON.parse(localStorage.getItem('nw_items')||'[]');
let score = parseInt(localStorage.getItem('nw_score')||'0');
let calendarData = JSON.parse(localStorage.getItem('nw_calendar')||'{}'); // key: YYYY-MM-DD -> {income, spent, saved}
let lang = localStorage.getItem('nw_lang')||'en';
let curDate = new Date(); curDate.setDate(1);
let todayStr = new Date().toISOString().split('T')[0];

const NEED_WORDS = ['rice','garri','beans','food','eat','family','medicine','drug','hospital','school','fees','book','rent','house','transport','fuel','light','nepa','water','work','job','business','learn','child','baby','uniform','provision','oil','salt','fuel','motor','bike'];
const WANT_WORDS = ['shawarma','pizza','burger','iphone','ps5','bet','alcohol','beer','club','party','wig','makeup','jewelry','gold','shoe new','cloth new','netflix','shisha','game','clothes','aso ebi'];

function smartDecide(text){ text=text.toLowerCase(); let n=0,w=0; NEED_WORDS.forEach(x=>{if(text.includes(x)) n+=2}); WANT_WORDS.forEach(x=>{if(text.includes(x)) w+=2}); if(text.match(/family.*eat|my family|baby|for work|business|to work|school/)) n+=5; if(text.match(/friends party|show off|shakara|flex|party/)) w+=4; if(n>w) return 'NEED'; if(w>n) return 'WANT'; return 'UNKNOWN'; }
function setLang(l){ lang=l; localStorage.setItem('nw_lang',l); render(); }
function setIncome(){ let v=parseInt(document.getElementById('dailyIncome').value); if(!v) return alert('Enter income'); income=v; localStorage.setItem('nw_income',income); render(); }
function addItem(){ let item=document.getElementById('item').value.trim(); let price=parseInt(document.getElementById('price').value)||0; let why=document.getElementById('why').value.trim(); let userChoice=document.getElementById('choice').value; if(!item||!price) return alert('Enter item and price'); let brain=smartDecide(item+' '+why); if(brain==='UNKNOWN') brain=userChoice||'NEED'; items.push({item,price,why,userChoice,brain,id:Date.now()}); localStorage.setItem('nw_items',JSON.stringify(items)); document.getElementById('item').value=''; document.getElementById('price').value=''; document.getElementById('why').value=''; render(); }
function deleteItem(id){ items=items.filter(x=>x.id!==id); localStorage.setItem('nw_items',JSON.stringify(items)); render(); }

function advise(){
  if(items.length===0) return alert('Add items first');
  let needs=items.filter(i=>i.brain==='NEED'); let wants=items.filter(i=>i.brain==='WANT');
  let needTotal=needs.reduce((s,i)=>s+i.price,0); let wantTotal=wants.reduce((s,i)=>s+i.price,0); let total=needTotal+wantTotal; let save=income-total;
  let adviceEl=document.getElementById('advice'); adviceEl.style.display='block'; let msg=''; let isPidgin = lang==='pidgin';
  if(income===0){ msg = isPidgin? `⚠️ Put income first!` : `⚠️ Set income first.`; }
  else if(total>income){
    let over=total-income;
    msg = isPidgin? `🚨 Omo over spend! Make ₦${income} but wan spend ₦${total} (over ₦${over}).\n✅ NEEDS ₦${needTotal} pay first.\n❌ COMOT WANTS ₦${wantTotal}` : `🚨 OVER! Income ₦${income} Spend ₦${total} Over ₦${over}.\n✅ NEEDS ₦${needTotal}\n❌ CUT WANTS ₦${wantTotal}`;
    score=Math.max(0,score-1);
  } else {
    if(isPidgin){ msg=`✅ Correct! Income ₦${income} Spend ₦${total} Save ₦${save}\n`; msg+= save>=income*0.2? `🔥 You get sense! Save ₦${save} +5` : `💡 Try save 20% (₦${Math.floor(income*0.2)}). Save small.`; score+= save>=income*0.2?5:2; }
    else { msg=`✅ GOOD! Income ₦${income} Spend ₦${total} Save ₦${save}\n`; msg+= save>=income*0.2? `🔥 Great save ₦${save} +5` : `💡 Save at least 20% (₦${Math.floor(income*0.2)})`; score+= save>=income*0.2?5:2; }
    // SAVE TO CALENDAR
    calendarData[todayStr] = {income, spent:total, saved:save, needs:needTotal, wants:wantTotal, items:items.length, date: new Date().toLocaleString()};
    localStorage.setItem('nw_calendar',JSON.stringify(calendarData));
  }
  adviceEl.innerText=msg; localStorage.setItem('nw_score',score); render(); renderCalendar();
}

function sharePlan(){
  if(items.length===0) return alert('Add items');
  let total=items.reduce((s,i)=>s+i.price,0); let save=income-total;
  let text=`🧠 My Money Today\nIncome: ₦${income}\n`; items.forEach(i=>{ text+=`${i.brain==='NEED'?'✅':'❌'} ${i.item} - ₦${i.price} (${i.brain})\n`; }); text+=`\nTotal ₦${total} Save ₦${save} Score ${score}\nhttps://saka1emma1-cpu.github.io/need-want/`;
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank');
}

function renderCalendar(){
  let year=curDate.getFullYear(); let month=curDate.getMonth();
  document.getElementById('calMonth').innerText = curDate.toLocaleString('default',{month:'long', year:'numeric'});
  let firstDay=new Date(year,month,1).getDay(); let daysInMonth=new Date(year,month+1,0).getDate();
  let grid=document.getElementById('calGrid'); grid.innerHTML='';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d=>{ let el=document.createElement('div'); el.className='cal-day-name'; el.innerText=d; grid.appendChild(el); });
  for(let i=0;i<firstDay;i++){ let el=document.createElement('div'); el.className='cal-day empty'; grid.appendChild(el); }
  for(let d=1; d<=daysInMonth; d++){
    let dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let data=calendarData[dateStr]; let el=document.createElement('div'); el.className='cal-day';
    if(dateStr===todayStr) el.classList.add('today');
    if(data){ if(data.saved>0) el.classList.add('saved'); else el.classList.add('no-save'); el.innerHTML=`${d}<span class="amt">₦${data.saved}</span>`; }
    else { el.innerHTML=`${d}`; if(d< new Date().getDate() || month < new Date().getMonth() || year < new Date().getFullYear()){ /* past empty stays */ } }
    el.onclick=()=>showDay(dateStr,data);
    grid.appendChild(el);
  }
}
function showDay(dateStr,data){
  let det=document.getElementById('calDetails'); det.style.display='block';
  if(!data){ det.innerHTML=`<b>${dateStr}</b><br>No record - you no save anything that day.`; }
  else { det.innerHTML=`<b>${dateStr}</b><br>Income ₦${data.income} | Spent ₦${data.spent} | <b style="color:${data.saved>0?'green':'red'}">Saved ₦${data.saved}</b><br>Needs ₦${data.needs} Wants ₦${data.wants}`; }
}
function changeMonth(dir){ curDate.setMonth(curDate.getMonth()+dir); renderCalendar(); }

function render(){
  document.getElementById('incomeDisplay').innerText=income; let total=items.reduce((s,i)=>s+i.price,0); let bal=income-total;
  let balEl=document.getElementById('balanceDisplay'); balEl.innerText='₦'+bal; balEl.style.color=bal<0?'#ff1744':'#00c853';
  document.getElementById('score').innerText='Score: '+score;
  document.getElementById('btnEng').className=lang=='en'?'active':''; document.getElementById('btnPid').className=lang=='pidgin'?'active':'';
  document.getElementById('spendList').innerHTML=items.map(i=>`<div class="list-item ${i.brain==='NEED'?'need':'want'}"><div><b>${i.item} - ₦${i.price}</b> <span class="badge ${i.brain==='NEED'?'badge-need':'badge-want'}">${i.brain}</span><br><small>${i.why||''}</small></div><button onclick="deleteItem(${i.id})" style="background:none; border:none; font-size:18px;">✕</button></div>`).join('');
  document.getElementById('summaryText').innerText= items.length? `Total: ₦${total} | Needs: ₦${items.filter(i=>i.brain==='NEED').reduce((s,i)=>s+i.price,0)} | Wants: ₦${items.filter(i=>i.brain==='WANT').reduce((s,i)=>s+i.price,0)}` : 'Add items';
  let histKeys=Object.keys(calendarData).sort().reverse().slice(0,5);
  document.getElementById('historyList').innerHTML = histKeys.length? histKeys.map(k=>{ let h=calendarData[k]; return `<div class="day-card"><b>${k}</b> - ${h.saved>0?'✅ Saved ₦'+h.saved:'❌ No save'}<br><small>Income ₦${h.income} Spent ₦${h.spent}</small></div>`}).join('') : '<small style="color:#999">No saves yet - get advice to mark calendar</small>';
}
function clearDay(){ if(confirm('Clear today?')){ items=[]; localStorage.removeItem('nw_items'); document.getElementById('advice').style.display='none'; render(); } }

render(); renderCalendar();
if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())); caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))); }
</script>
</body>
</html>
